<ion-content class="ion-padding">
  <div style="max-width: 400px; margin: 80px auto;">
    <h2>Iniciar Sesión - Proyecto DAM</h2>
    
    <ion-item>
      <ion-input label="Correo electrónico" labelPlacement="stacked" [(ngModel)]="email" type="email" placeholder="admin@empresa.com"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Contraseña" labelPlacement="stacked" [(ngModel)]="password" type="password" placeholder="1234"></ion-input>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" (click)="onLogin()">Entrar</ion-button>
  </div>
</ion-content>
